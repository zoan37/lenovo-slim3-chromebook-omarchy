# quigon, mainline kernel: load the codec drivers before the MT8189 machine driver. Without this the card can be
# assembled before the RT5682S/RT1019P/DMIC components exist ("Neither Component name/of_node are set for
# I2SIN0_BE") and never comes up: a probe deferred for the AFE leaves the card half set up for the retry. (The
# ChromeOS kernel has no module by this name, so this is inert there.)
softdep mt8189_nau8825 pre: snd_soc_mt8189_afe snd_soc_rt5682s snd_soc_rt1015p snd_soc_dmic
