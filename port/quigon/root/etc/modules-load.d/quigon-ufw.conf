# ufw/iptables matches that must exist before ufw.service loads its rules at boot (it runs Before=sysinit.target;
# without these its before.rules fail with "Extension conntrack is not supported" and only the DROP policy remains)
nf_conntrack
xt_conntrack
# the REJECT targets of ufw's rate-limit chains (user.rules, user6.rules): on the ChromeOS kernel ip6t_REJECT wasn't
# autoloaded at boot ("Extension REJECT revision 0 not supported"), user6.rules failed, and the recovery's
# `ufw reload` failure then wrote ENABLED=no, which turned the firewall off under both kernels
ipt_REJECT
ip6t_REJECT
