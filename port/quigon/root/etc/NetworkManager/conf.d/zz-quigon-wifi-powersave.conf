# quigon: Wi-Fi power save on, as ChromeOS ships it on this hardware (its kernel keeps CONFIG_CFG80211_DEFAULT_PS=y
# and nothing turns it off). Omarchy 4 turns it off (omarchy-wifi-powersave.conf: latency spikes on idle links, Intel
# BE200/BE211 link drops); here it saves ~140 mW of a ~2.7 W idle (5%) on the MT7922. Sorts after Omarchy's file, so
# it wins. To go back to Omarchy's choice, delete this file and reconnect.
[connection]
wifi.powersave = 3
