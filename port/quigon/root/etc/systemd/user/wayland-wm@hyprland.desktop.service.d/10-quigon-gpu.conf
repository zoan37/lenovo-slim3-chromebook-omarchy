[Service]
# Mali GPU for the compositor only (ChromeOS's libmali + egl-mali-shim). Remove or rename
# /etc/quigon/gpu.env to go back to llvmpipe. Apps launched through uwsm get the manager's
# environment, and the shim clears LD_PRELOAD/LD_LIBRARY_PATH inside Hyprland for its direct children.
EnvironmentFile=-/etc/quigon/gpu.env
# A stale software-GL setting in the user manager (it outlives sessions) would override gpu.env's Zink for every app.
UnsetEnvironment=LIBGL_ALWAYS_SOFTWARE GALLIUM_DRIVER
