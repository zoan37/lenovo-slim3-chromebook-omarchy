# Compressed swap in RAM, 2x RAM like ChromeOS on this machine (it had 15.4G on 7.9G RAM). No swap on the USB stick: slow and it wears the flash.
# The ChromeOS kernel has no CONFIG_MEMCG, so systemd-oomd can't run; zram is the cushion before the kernel OOM killer.
[zram0]
zram-size = ram * 2
# lz4 first, as ChromeOS: swap-in 2.25x faster than zstd (5.1 vs 11.5 us/page); zstd recompresses pages that stay
# idle (quigon-zram-recompress.timer), so cold data still gets zstd's density. Needs a kernel with the lz4 zram
# backend and ZRAM_MULTI_COMP (mainline def15+, the ChromeOS kernel).
compression-algorithm = lz4 zstd
swap-priority = 100
