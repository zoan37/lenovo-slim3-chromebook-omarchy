# Compressed swap in RAM (ChromeOS uses zram on this machine too). No swap on the USB stick: slow and it wears the flash.
# The ChromeOS kernel has no CONFIG_MEMCG, so systemd-oomd can't run; zram is the cushion before the kernel OOM killer.
[zram0]
zram-size = ram
compression-algorithm = zstd
swap-priority = 100
