# Compressed swap in RAM, 2x RAM like ChromeOS on this machine (it had 15.4G on 7.9G RAM). No swap on the USB stick: slow and it wears the flash.
# The ChromeOS kernel has no CONFIG_MEMCG, so systemd-oomd can't run; zram is the cushion before the kernel OOM killer.
[zram0]
zram-size = ram * 2
compression-algorithm = zstd
swap-priority = 100
